<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STOP WAR PROJECT — MEMORIAL</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 30px 20px 25px;
        }

        h1 {
            margin: 0;
            font-size: 2em;
            letter-spacing: 4px;
        }

        .count {
            margin-top: 10px;
            color: #777;
            font-size: 0.85em;
            letter-spacing: 2px;
        }

        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #777;
            text-decoration: none;
            font-size: 0.75em;
            letter-spacing: 1px;
            z-index: 20;
        }

        .back:hover {
            color: white;
        }

        .memorial {
            width: 94%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 0 60px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 35px 25px;
            margin-bottom: 35px;
        }

        .memory {
            text-align: center;
            cursor: pointer;
        }

        .dot {
            width: 7px;
            height: 7px;
            margin: 0 auto 7px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .memory:hover .dot {
            transform: scale(2);
            box-shadow: 0 0 18px white;
        }

        .number {
            color: #777;
            font-size: 10px;
        }

        .loading {
            text-align: center;
            color: #555;
            padding: 100px 20px;
        }

        .info {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            width: min(90%, 350px);
            padding: 18px;
            background: rgba(15,15,15,0.96);
            border: 1px solid #333;
            border-radius: 8px;
            text-align: center;
            display: none;
            z-index: 50;
        }

        .info strong {
            font-size: 1em;
        }

        .info .date {
            color: #777;
            font-size: 0.8em;
            margin: 8px 0 15px;
        }

        .info a {
            color: white;
            text-decoration: none;
            font-size: 0.8em;
            letter-spacing: 1px;
        }

        .info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {

            .row {
                grid-template-columns: repeat(4, 1fr);
                gap: 30px 15px;
            }

        }

        @media (max-width: 500px) {

            .row {
                grid-template-columns: repeat(3, 1fr);
                gap: 28px 10px;
            }

        }
    </style>
</head>

<body>

    <a href="index.html" class="back">← BACK</a>

    <header>
        <h1>MEMORIAL</h1>

        <div class="count" id="count">
            LOADING TESTIMONIES...
        </div>
    </header>

    <div class="memorial" id="memorial">

        <div class="loading" id="loading">
            Loading memorial...
        </div>

    </div>

    <div class="info" id="info">

        <strong id="author"></strong>

        <div class="date" id="date"></div>

        <a id="link"
           href="#"
           target="_blank"
           rel="noopener noreferrer">
            VIEW ON TIKTOK →
        </a>

    </div>


    <script>

        const SUPABASE_URL = "https://wbwctmoikpvbithczebl.supabase.co/rest/v1/";
        const SUPABASE_ANON_KEY = "sb_publishable_6shdQ6Doz2mj76KnDOe9gA_xd58ISWn";


        async function loadMemorial() {

            const container =
                document.getElementById("memorial");

            const loading =
                document.getElementById("loading");

            const count =
                document.getElementById("count");


            try {

                const response = await fetch(
                    SUPABASE_URL +
                    "/posts?select=tiktok_id,url,author,posted_at&order=posted_at.asc&limit=500",
                    {
                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization":
                                "Bearer " + SUPABASE_ANON_KEY
                        }
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "Supabase error: " +
                        response.status
                    );

                }


                const posts =
                    await response.json();


                loading.remove();


                count.textContent =
                    posts.length +
                    " TESTIMONIES";


                /*
                 * Five testimonies per row.
                 * The oldest is #1.
                 * The newest receives the highest number.
                 */

                const columns = 25;


                for (
                    let i = 0;
                    i < posts.length;
                    i += columns
                ) {


                    const row =
                        document.createElement("div");

                    row.className = "row";


                    const rowPosts =
                        posts.slice(
                            i,
                            i + columns
                        );


                    rowPosts.forEach(
                        (post, rowIndex) => {


                            const memory =
                                document.createElement("div");

                            memory.className =
                                "memory";


                            const dot =
                                document.createElement("div");

                            dot.className =
                                "dot";


                            const number =
                                document.createElement("div");

                            number.className =
                                "number";


                            const memoryNumber =
                                i + rowIndex + 1;


                            number.textContent =
                                memoryNumber;


                            memory.appendChild(dot);
                            memory.appendChild(number);


                            memory.addEventListener(
                                "click",
                                function () {

                                    document.getElementById(
                                        "author"
                                    ).textContent =
                                        post.author ||
                                        "Unknown author";


                                    document.getElementById(
                                        "date"
                                    ).textContent =
                                        post.posted_at ||
                                        "";


                                    document.getElementById(
                                        "link"
                                    ).href =
                                        post.url ||
                                        "#";


                                    document.getElementById(
                                        "info"
                                    ).style.display =
                                        "block";

                                }
                            );


                            row.appendChild(memory);

                        }
                    );


                    container.appendChild(row);

                }


            } catch (error) {

                console.error(error);

                loading.textContent =
                    "Unable to load memorial.";

            }

        }


        loadMemorial();

    </script>

</body>
</html>
